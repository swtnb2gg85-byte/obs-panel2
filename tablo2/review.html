<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Студия 68 - Обзор матча</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      margin: 0;
      padding: 0;
    }

    .crop {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 1920px;
      height: 1126px;   /* 1080 + 46 */
      border: none;
      display: block;
      margin-top: -46px; /* сдвигаем вверх на 46px */
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="crop">
    <iframe
      src="https://script.google.com/macros/s/AKfycby_hRLtTc1gCcCAZ4Z4CeoZ96rj9Uj6zf1_LOM4rTJMityxawX6wSrs7mc4qgQk85M/exec"
      scrolling="no"
      allowtransparency="true"
      frameborder="0"
    ></iframe>
  </div>
</body>
</html>
