<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0f; }
    .clip {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: calc(100% + 40px);
      margin-top: -40px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="clip">
    <iframe src="https://script.google.com/macros/s/AKfycbwKnYRdXNtiTU_Gi-70h4Zd_ZiRhBaZ2tscZGZJEaGHcCJg9a2dThy4C-kIDnTcDG6FIw/exec"></iframe>
  </div>
</body>
</html>
