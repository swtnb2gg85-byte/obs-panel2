<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0f; }
    .clip {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 100%;
      height: calc(100% + 60px);
      margin-top: -60px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="clip">
    <!-- Замени src на URL твоей панели управления -->
    <iframe src="https://script.google.com/macros/s/AKfycbyT5Q5SWHcSvQhvznkQgzlq-y987U-9QvtWpl8Qq09WfkLC9UY55j0FgUdy9QKs3dUg/exec"></iframe>
  </div>
</body>
</html>
