<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
    }

    .crop {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 1920px;
      height: 126px;   /* 1080 + 88 */
      border: none;
      display: block;
      margin-top: -46px; /* плашка уходит за верхний край */
    }
  </style>
</head>
<body>
  <div class="crop">
    <iframe
      src="https://script.google.com/macros/s/AKfycbwzByMTFtj4HmIGSJmCw_Ht7XzcSXRdnXsYoL4HNET6f4L8lzwZEvDA_G-TovzEk1CF/exec"
      scrolling="no"
      allowtransparency="true"
    ></iframe>
  </div>
</body>
</html>
