<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, initial-scale=1.0">
  <title>Студия 68 - Обзор матча</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      margin: 0;
      padding: 0;
    }

    .crop {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      position: relative;
    }

    iframe {
      width: 1920px;
      height: 1126px;   /* 1080 + 46 (оставляем для скрытия баннера) */
      border: none;
      display: block;
      margin-top: 55px;  /* 101 - 46 = 55px (сдвигаем вниз, чтобы компенсировать поднятие) */
      background: transparent;
    }
  </style>
</head>
<body>
  <div class="crop">
    <iframe
      src="https://script.google.com/macros/s/AKfycbyPMyx2rHY4RcMzxVMtRVVjqLPMw6a1-ufT_s9ogRNta0c-r8DrTP0lvibmH8XGu5si/exec"
      scrolling="no"
      allowtransparency="true"
      frameborder="0"
    ></iframe>
  </div>
</body>
</html>
